
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8b5cf6" />
    <title>SpeakEasy AAC</title>
    <link rel="manifest" href="./manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        console.error("Global Error:", message, error);
        const root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
            root.innerHTML = `
            <div style="color: #ef4444; padding: 20px; font-family: sans-serif; text-align: center;">
                <h1>Startup Error</h1>
                <p>${message}</p>
                <button onclick="window.location.reload()" style="padding: 10px; margin-top: 10px;">Reload</button>
            </div>
            `;
        }
      };

      window.process = { env: { NODE_ENV: 'production' } };
      
      tailwind.config = {
        future: {
          hoverOnlyWhenSupported: true,
        },
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#8b5cf6',
              secondary: '#ec4899',
              success: '#22c55e',
              warning: '#f59e0b',
              background: '#f0f4f8',
            },
            fontFamily: {
              sans: ['Nunito', 'sans-serif'],
            },
            boxShadow: {
              'card': '0 4px 0 0 rgba(0,0,0,0.1)',
              'btn': '0 4px 0 0 rgba(0,0,0,0.2)',
              'btn-active': '0 0 0 0 rgba(0,0,0,0.2)',
            }
          },
        },
      }
    </script>
    <style>
      :root { color-scheme: light; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      body {
        background-color: #f0f4f8;
        color: #1e293b;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-touch-callout: none;
        margin: 0;
      }
      .pattern-grid {
        background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
        background-size: 20px 20px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@latest",
    "react/": "https://esm.sh/react@latest/",
    "react/jsx-runtime": "https://esm.sh/react@latest/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@latest",
    "react-dom/": "https://esm.sh/react-dom@latest/",
    "react-dom/client": "https://esm.sh/react-dom@latest/client",
    "lucide-react": "https://esm.sh/lucide-react@latest?deps=react@latest,react-dom@latest",
    "@google/genai": "https://esm.sh/@google/genai@latest",
    "@capacitor/core": "https://esm.sh/@capacitor/core@latest",
    "@capacitor/filesystem": "https://esm.sh/@capacitor/filesystem@latest?deps=@capacitor/core@latest",
    "@capacitor/haptics": "https://esm.sh/@capacitor/haptics@latest?deps=@capacitor/core@latest",
    "@capacitor/splash-screen": "https://esm.sh/@capacitor/splash-screen@latest?deps=@capacitor/core@latest",
    "@capgo/capacitor-speech-synthesis": "https://esm.sh/@capgo/capacitor-speech-synthesis@latest?deps=@capacitor/core@latest",
    "react-router-dom": "https://esm.sh/react-router-dom@latest?deps=react@latest,react-dom@latest",
    "@remix-run/router": "https://esm.sh/@remix-run/router@latest"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // In some preview environments (iframe/sandbox), registration fails due to domain mismatch.
          // We catch this to prevent scary console errors, but it will work in Production/Android.
          navigator.serviceWorker.register('./sw.js')
            .then(registration => {
              console.log('SW registered');
            })
            .catch(registrationError => {
              console.warn('SW registration skipped (expected in preview/sandbox):', registrationError.message);
            });
        });
      }
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
