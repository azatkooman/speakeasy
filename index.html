<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8b5cf6" />
    <title>SpeakEasy AAC</title>
    <link rel="manifest" href="/manifest.json" />
    <script>
      window.onerror = function (message) {
        console.error('Global Error:', message);
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML =
            '<div style="color:#ef4444;padding:20px;font-family:sans-serif;text-align:center">' +
            '<h1>Startup Error</h1><p>' + message + '</p>' +
            '<button onclick="window.location.reload()" style="padding:10px;margin-top:10px">Reload</button>' +
            '</div>';
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
